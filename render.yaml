# Render blueprint for AccessAudit.
# NOTE: the free plan has no persistent disk, so the SQLite database, reports
# and screenshots are lost on every deploy or restart. For anything beyond a
# demo, switch `plan` to "starter" (or higher) and uncomment the disk block so
# DATA_DIR survives restarts.
services:
  - type: web
    name: accessaudit
    env: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: PORT
        value: "3000"
      - key: BASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_SINGLE
        sync: false
      - key: STRIPE_PRICE_REVIEWED
        sync: false
      - key: STRIPE_PRICE_PACK5
        sync: false
      - key: STRIPE_COUPON_FOUNDING
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
