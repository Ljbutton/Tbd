<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - Northwind Candles</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">Northwind Candles</a>
    <nav aria-label="Main">
      <a href="/">Home</a>
      <a href="/products.html">Products</a>
      <a href="/about.html">About</a>
      <a href="/contact.html">Contact</a>
      <a href="/checkout.html">Checkout</a>
    </nav>
  </header>
  <main>
    <h1>Get in touch</h1>
    <p>Questions about an order, wholesale pricing or custom scents? Send us a note.</p>
    <form action="/contact.html" method="get">
      <div class="field">
        <!-- SEEDED VIOLATION (label): text input with no label of any kind -->
        <input type="text" name="name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <!-- SEEDED VIOLATION (duplicate-id-aria): id "email" is used twice and referenced by the label above -->
        <input type="email" name="email" id="email">
      </div>
      <div class="field">
        <!-- SEEDED VIOLATION (duplicate-id-aria, label): second element with id "email"; also has no label -->
        <input type="email" name="email_confirm" id="email">
      </div>
      <div class="field">
        <!-- SEEDED VIOLATION (label): placeholder-only field, no label -->
        <textarea name="message" rows="4" placeholder="Your message"></textarea>
      </div>
      <div class="field">
        <!-- SEEDED VIOLATION (button-name): submit button with no text -->
        <button type="submit"><span class="icon"></span></button>
      </div>
    </form>
    <h2>Visit the workshop</h2>
    <p>12 Pier Lane, open Thursday to Saturday, 10am to 4pm.</p>
  </main>
  <footer>
    <p>Northwind Candles is a fictional store used to test accessibility tooling.</p>
  </footer>
</body>
</html>
